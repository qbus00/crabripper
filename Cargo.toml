[package]
name = "streamripper-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A Rust port of streamripper (work in progress): records shoutcast/icecast streams to per-track files."
license = "GPL-2.0-only"
authors = ["Jakub Kaprzyk"]

[[bin]]
name = "streamripper-rs"
path = "src/main.rs"

[dependencies]
# TLS for https:// streams — the one place we take a dependency, since rolling
# your own crypto is never acceptable. rustls is pure Rust (ring crypto backend,
# no OpenSSL/C), which keeps the Linux build fully static and cross-compilable
# from macOS with no system libraries. Certificate verification is OFF by default
# to mirror the C fork (opt-in verification is a planned flag).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Pure-Rust multi-codec decoder for --wav and silence detection. One crate
# replaces the C fork's minimp3 + faad2 + libvorbis (three C libs). No C build.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "flac", "vorbis", "ogg"] }
# AES-128-CBC for HLS #EXT-X-KEY segment decryption (audited pure Rust, no C).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
strip = true
